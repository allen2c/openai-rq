[project]
authors = [{ name = "AllenChou", email = "f1470891079@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx", "openai>=1.0", "redis>=5.0", "typer"]
description = "OpenAI-compatible client + worker that bridge inference requests over a Redis queue (Redis Streams), for running LLMs across heavily restricted networks."
keywords = [
    "inference",
    "llm",
    "openai",
    "proxy",
    "queue",
    "redis",
    "redis-streams",
    "vllm",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "openai-rq"
readme = "README.md"
requires-python = ">=3.11,<4"
version = "0.1.2"

[project.urls]
Documentation = "https://allen2c.github.io/openai-rq/"
Homepage = "https://github.com/allen2c/openai-rq"
Issues = "https://github.com/allen2c/openai-rq/issues"
Repository = "https://github.com/allen2c/openai-rq"

[project.optional-dependencies]
dev = ["black", "isort", "pytest", "pytest-asyncio", "pyyaml", "ruff"]

[project.scripts]
openai-rq = "openai_rq.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
build-backend = "poetry.core.masonry.api"
requires = ["poetry-core>=2.0.0,<3.0.0"]
