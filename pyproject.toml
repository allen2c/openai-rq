[project]
name = "openai-rq"
version = "0.1.1"
description = "OpenAI-compatible client + worker that bridge inference requests over a Redis queue (Redis Streams), for running LLMs across heavily restricted networks."
readme = "README.md"
authors = [{ name = "AllenChou", email = "f1470891079@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4"
keywords = [
    "openai",
    "redis",
    "redis-streams",
    "vllm",
    "llm",
    "inference",
    "proxy",
    "queue",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["openai>=1.0", "redis>=5.0", "httpx", "typer"]

[project.urls]
Homepage = "https://github.com/allen2c/openai-rq"
Documentation = "https://allen2c.github.io/openai-rq/"
Repository = "https://github.com/allen2c/openai-rq"
Issues = "https://github.com/allen2c/openai-rq/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "black", "isort", "ruff", "pyyaml"]

[project.scripts]
openai-rq = "openai_rq.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
