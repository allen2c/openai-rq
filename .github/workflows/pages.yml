# Build & publish the openai-rq slide deck (docs/index.html) to GitHub Pages.
#
# One-time setup (repo owner): Settings -> Pages -> Build and deployment ->
# Source = "GitHub Actions". Public repos only (private repos need a paid plan).
# After that, every push to main touching the deck redeploys it to
# https://<owner>.github.io/openai-rq/.

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/index.html
      - .github/workflows/pages.yml
  workflow_dispatch:

# Serialise deploys; never cancel one mid-flight (a half-published site is worse
# than a queued run).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # build only reads the repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stage only the deck (internal design docs stay private)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp docs/index.html _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # only deploy needs the Pages / OIDC writes
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
